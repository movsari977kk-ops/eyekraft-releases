name: Build and publish verified Windows release
on:
  push:
    paths: ['.github/workflows/build-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eyekraft-release-0.7.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Download source from private draft and verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.1 --repo $env:GITHUB_REPOSITORY --pattern build-source-0.7.1.zip --dir .
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          if ((Get-FileHash -LiteralPath build-source-0.7.1.zip -Algorithm SHA256).Hash -ne '193A957BF19DA73DBE88A5CA5B5A311CBE720CEC8143565159C499386D1400E8') { throw 'Source hash mismatch' }
          Expand-Archive -LiteralPath build-source-0.7.1.zip -DestinationPath source
      - name: Install pinned dependencies
        working-directory: source
        run: npm ci
      - name: Verify accounting, permissions and migrations
        working-directory: source
        run: npm test
      - name: Build Windows installer
        working-directory: source
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build
      - name: Check packaged application with separate test data
        working-directory: source
        run: node tests/windows-package.cjs
      - name: Verify updater checksum
        working-directory: source
        run: node -e "const fs=require('node:fs'),c=require('node:crypto'),m=require('js-yaml').load(fs.readFileSync('dist/latest.yml','utf8'));if(m.version!=='0.7.1'||c.createHash('sha512').update(fs.readFileSync('dist/'+m.path)).digest('base64')!==m.sha512)process.exit(1)"
      - name: Upload binaries, remove private source, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.7.1 source/dist/Eyekraft-Setup-0.7.1.exe source/dist/Eyekraft-Setup-0.7.1.exe.blockmap source/dist/latest.yml --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; release remains a draft' }
          gh release delete-asset v0.7.1 build-source-0.7.1.zip --repo $env:GITHUB_REPOSITORY --yes
          if ($LASTEXITCODE -ne 0) { throw 'Private source cleanup failed; release remains a draft' }
          $release = gh api repos/$env:GITHUB_REPOSITORY/releases/425231021 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($release.assets | Where-Object { $_.name -like '*source*' }).Count -gt 0) { throw 'Do not publish source archives' }
          gh release edit v0.7.1 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }