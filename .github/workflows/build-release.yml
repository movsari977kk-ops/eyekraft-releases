name: Build and publish verified Windows release
on:
  push:
    paths: ['.github/workflows/build-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eyekraft-release-0.7.9
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified build inputs
        shell: pwsh
        run: |
          gh release download v0.7.9 --repo $env:GITHUB_REPOSITORY --pattern build-source-0.7.9.zip --pattern initial-stock-0.7.9.zip --dir .
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-FileHash build-source-0.7.9.zip -Algorithm SHA256).Hash -ne '2984E294A1C8171FF4BF57D1C549AB46A54F27F8B9918E142348FB85C6DC559E') { throw 'Source hash mismatch' }
          if ((Get-FileHash initial-stock-0.7.9.zip -Algorithm SHA256).Hash -ne '7242F8A26FC6128F8741CA0FBAE2C1133B492AC866FD27A9CC64B78972D186E3') { throw 'Stock hash mismatch' }
          Expand-Archive build-source-0.7.9.zip source
          Expand-Archive initial-stock-0.7.9.zip source
      - name: Preserve phone assets before old release cleanup
        shell: pwsh
        run: |
          gh release download v0.7.7 --repo $env:GITHUB_REPOSITORY --pattern phone-catalog-0.7.7.zip --dir .
          gh release download v0.7.8 --repo $env:GITHUB_REPOSITORY --pattern phone-overlay-0.7.8-final2.zip --dir .
          if ((Get-FileHash phone-catalog-0.7.7.zip -Algorithm SHA256).Hash -ne 'B81AFAD37A193E038C746C383BFD7CDF31ABC5C03B43FE4CD3FDDF72535C51DD') { throw 'Phone base mismatch' }
          if ((Get-FileHash phone-overlay-0.7.8-final2.zip -Algorithm SHA256).Hash -ne 'F78CABCF1E126E105054731250A68A691614EF1E4D6213E2A4D492E08EC88F94') { throw 'Phone overlay mismatch' }
          Copy-Item phone-catalog-0.7.7.zip phone-catalog-assets.zip
          Copy-Item phone-overlay-0.7.8-final2.zip phone-overlay-assets.zip
      - name: Install pinned dependencies
        working-directory: source
        run: npm ci
      - name: Verify logic and migrations
        working-directory: source
        run: npm test
      - name: Build public installer without connection secrets
        working-directory: source
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build
      - name: Verify installer, stock and updater checksum
        working-directory: source
        shell: pwsh
        run: |
          node -e "const fs=require('fs'),c=require('crypto'),m=require('js-yaml').load(fs.readFileSync('dist/latest.yml','utf8')),r='dist/win-unpacked/resources/',p=JSON.parse(fs.readFileSync(r+'initial-stock/catalog-import.json'));if(m.version!=='0.7.9'||m.path!=='Eyekraft-Setup-0.7.9.exe'||c.createHash('sha512').update(fs.readFileSync('dist/'+m.path)).digest('base64')!==m.sha512||p.items.length!==390||p.items.some(x=>x.quantity!==1)||fs.existsSync(r+'salon-setup.json'))process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Publish complete release
        shell: pwsh
        run: |
          gh release upload v0.7.9 source/dist/Eyekraft-Setup-0.7.9.exe source/dist/Eyekraft-Setup-0.7.9.exe.blockmap source/dist/latest.yml phone-catalog-assets.zip phone-overlay-assets.zip --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed' }
          gh release delete-asset v0.7.9 build-source-0.7.9.zip --repo $env:GITHUB_REPOSITORY --yes
          gh release delete-asset v0.7.9 initial-stock-0.7.9.zip --repo $env:GITHUB_REPOSITORY --yes
          $r = gh api repos/$env:GITHUB_REPOSITORY/releases/tags/v0.7.9 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed' }
          if ($r.assets.Count -ne 5 -or @($r.assets | Where-Object { $_.state -ne 'uploaded' }).Count -gt 0) { throw 'Incomplete release' }
          gh release edit v0.7.9 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }

