name: Publish verified 0.7.9
on:
  push:
    paths: ['.github/workflows/build-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify existing assets and publish
        run: |
          set -e
          gh release view v0.7.9 --repo "$GITHUB_REPOSITORY" --json assets,tagName,isDraft > release.json
          node -e 'const r=require("./release.json"); const names=["Eyekraft-Setup-0.7.9.exe","Eyekraft-Setup-0.7.9.exe.blockmap","latest.yml","phone-catalog-assets.zip","phone-overlay-assets.zip"]; if(r.tagName!=="v0.7.9"||r.assets.length!==5||names.some(n=>!r.assets.some(a=>a.name===n&&a.size>0&&a.state==="uploaded")))throw Error("Incomplete release")'
          gh release edit v0.7.9 --repo "$GITHUB_REPOSITORY" --draft=false --latest
