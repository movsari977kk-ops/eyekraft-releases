name: Build and publish verified Windows release
on:
  push:
    paths: ['.github/workflows/build-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eyekraft-release-0.7.8
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified build input
        shell: pwsh
        run: |
          gh release download v0.7.8 --repo $env:GITHUB_REPOSITORY --pattern build-source-0.7.8.zip --pattern phone-overlay-0.7.8.zip --dir .
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-FileHash build-source-0.7.8.zip -Algorithm SHA256).Hash -ne 'B34B93A6951C47DEF7307ECED9CFBB2CA04B531EC7716C9968BE439BF1A7437B') { throw 'Source hash mismatch' }
          if ((Get-FileHash phone-overlay-0.7.8.zip -Algorithm SHA256).Hash -ne 'D02872FB14AE9961BCCC387621400DDFF87EF0209D19B1ECCE550DB78F00BF3F') { throw 'Phone hash mismatch' }
          Expand-Archive build-source-0.7.8.zip source
          Expand-Archive phone-overlay-0.7.8.zip source/phone-catalog -Force
      - name: Install pinned dependencies
        working-directory: source
        run: npm ci
      - name: Verify logic and migrations
        working-directory: source
        run: npm test
      - name: Build installer
        working-directory: source
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build
      - name: Verify updater checksum
        working-directory: source
        run: node -e "const fs=require('node:fs'),c=require('node:crypto'),m=require('js-yaml').load(fs.readFileSync('dist/latest.yml','utf8'));if(m.version!=='0.7.8'||c.createHash('sha512').update(fs.readFileSync('dist/'+m.path)).digest('base64')!==m.sha512)process.exit(1)"
      - name: Upload and publish complete release
        shell: pwsh
        run: |
          gh release upload v0.7.8 source/dist/Eyekraft-Setup-0.7.8.exe source/dist/Eyekraft-Setup-0.7.8.exe.blockmap source/dist/latest.yml --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed' }
          gh release delete-asset v0.7.8 phone-catalog-0.7.8.zip --repo $env:GITHUB_REPOSITORY --yes
          gh release delete-asset v0.7.8 build-source-0.7.8.zip --repo $env:GITHUB_REPOSITORY --yes
          if ($LASTEXITCODE -ne 0) { throw 'Private source cleanup failed' }
          $r = gh api repos/$env:GITHUB_REPOSITORY/releases/429819512 | ConvertFrom-Json
          if (@($r.assets | Where-Object { $_.name -like '*source*' }).Count -gt 0 -or @($r.assets | Where-Object { $_.state -ne 'uploaded' }).Count -gt 0) { throw 'Incomplete assets; keep draft' }
          gh release edit v0.7.8 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }
